# ─────────────────────────────────────────────────────────────────────────────
# telegraf.conf — Aviário
# Consome tópicos MQTT do broker e grava no InfluxDB 2.x
# ─────────────────────────────────────────────────────────────────────────────

[agent]
  interval          = "10s"
  round_interval    = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval    = "10s"
  hostname          = "aviario-server"

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUT — InfluxDB 2.x
# ─────────────────────────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://localhost:8086"]
  token        = "SEU_TOKEN_INFLUXDB"   # gerado no setup do InfluxDB
  organization = "aviario"
  bucket       = "aviario"

# ─────────────────────────────────────────────────────────────────────────────
# INPUT — MQTT: tópico de sensores (ATtiny85)
# Payload JSON: {"temperatura":"25.5","umidade":60,"pressao_pa":101325,"nh3_ppm":"12.3","rssi":-75,"snr":"8.2"}
# ─────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers   = ["tcp://192.168.0.3:1883"]   # endereço do broker Mosquitto
  topics    = ["aviario/no1/sensores"]
  qos       = 0
  data_format = "json"

  # Nome da measurement no InfluxDB
  name_override = "sensores"

  # Tags fixas para identificar o nó
  [inputs.mqtt_consumer.tags]
    no       = "1"
    tipo     = "sensor"
    local    = "galpao"

  # Campos numéricos esperados no JSON
  json_string_fields = []

# ─────────────────────────────────────────────────────────────────────────────
# INPUT — MQTT: tópico de estado dos atuadores (ESP32 atuador)
# Payload JSON: {"v1":1,"v2":0,"asp":1,"neb":0}
# ─────────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers   = ["tcp://192.168.0.3:1883"]
  topics    = ["aviario/no1/atuadores/estado"]
  qos       = 0
  data_format = "json"

  name_override = "atuadores"

  [inputs.mqtt_consumer.tags]
    no       = "1"
    tipo     = "atuador"
    local    = "galpao"
